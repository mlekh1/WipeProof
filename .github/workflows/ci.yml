name: WipeProof CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    name: Test, Lint & Security SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y hdparm nvme-cli util-linux

      - name: Install Python Package & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov hypothesis ruff mypy bandit pip-audit

      - name: Linting (Ruff)
        run: ruff check .

      - name: Static Type Checking (Mypy)
        run: mypy wipeproof --ignore-missing-imports

      - name: Static Security Analysis (Bandit SAST)
        run: bandit -r wipeproof -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit || echo "Dependency audit logged"

      - name: Run Test Suite with Coverage
        run: |
          pytest tests --cov=wipeproof --cov-report=term-missing --cov-report=xml

      - name: Execute End-to-End Reproducible Demo
        run: python demo.py
